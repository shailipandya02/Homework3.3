# Logstash pipeline: ecommerce_data.csv  ->  Elasticsearch index "ecommerce_data"
#
# Built from the assignment's starter snippet, with these deliberate changes (see "key learnings"):
#  1. csv FILTER instead of csv CODEC   - the codec is not bundled with Logstash (needs
#     `logstash-plugin install logstash-codec-csv`) and cannot name columns reliably; the filter is bundled.
#  2. start_position + sincedb_path     - without them a file input only tails NEW lines and never reads an existing CSV.
#  3. skip_header                       - otherwise the header row is indexed as a bogus document.
#  4. timezone => "UTC" on the date filter - otherwise dates shift by a day on machines east of UTC.
#  5. explicit type conversion          - CSV values arrive as strings; numbers must be numeric to sum/avg/range.
#  6. document_id                       - makes re-runs idempotent (re-ingesting overwrites instead of duplicating).
#
# Env vars (optional):  CSV_PATH=/full/path/ecommerce_data.csv   ES_HOST=localhost:9200

input {
  file {
    path => "${CSV_PATH:/usr/share/logstash/data_in/ecommerce_data.csv}"
    start_position => "beginning"
    sincedb_path => "/dev/null"          # NUL on Windows; forget read position so every run re-reads the file
    mode => "tail"
  }
}

filter {
  csv {
    separator => ","
    skip_header => true
    columns => [
      "order_id", "order_date", "customer_id", "customer_name", "customer_email",
      "country", "city", "latitude", "longitude",
      "product_id", "product_name", "category", "quantity", "unit_price",
      "discount_pct", "total_amount", "payment_method", "order_status", "shipping_method"
    ]
  }

  # --- from the starter snippet: keep the raw string, then parse it into a real date ---
  mutate {
    rename => { "order_date" => "order_date_string" }
  }
  date {
    match => [ "order_date_string", "yyyy-MM-dd" ]
    target => "order_date"
    timezone => "UTC"
  }

  # --- numeric types ---
  mutate {
    convert => {
      "quantity"     => "integer"
      "discount_pct" => "integer"
      "unit_price"   => "float"
      "total_amount" => "float"
      "latitude"     => "float"
      "longitude"    => "float"
    }
  }

  # --- geo_point for Kibana Maps (two steps: add_field runs AFTER convert inside one mutate block) ---
  mutate {
    add_field => { "[location][lat]" => "%{latitude}" "[location][lon]" => "%{longitude}" }
  }
  mutate {
    convert => { "[location][lat]" => "float" "[location][lon]" => "float" }
  }

  # --- drop ingest noise ---
  mutate {
    remove_field => [ "message", "@version", "host", "log", "event", "order_date_string" ]
  }
}

output {
  elasticsearch {
    hosts => [ "${ES_HOST:localhost:9200}" ]
    index => "ecommerce_data"
    document_id => "%{order_id}_%{product_id}"
    # Native install with ES 8 security ON (default outside Docker) - uncomment and adjust:
    # hosts => [ "https://localhost:9200" ]
    # user => "elastic"
    # password => "${ES_PASSWORD}"
    # ssl_enabled => true
    # ssl_certificate_authorities => "/path/to/elasticsearch/config/certs/http_ca.crt"
  }
  stdout { codec => dots }               # one dot per indexed event; handy progress indicator
}
