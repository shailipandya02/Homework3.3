# Local ELK 8.15 lab (single node, security OFF - lab use only, never expose to the internet).
#
#   docker compose up -d elasticsearch kibana          # start ES + Kibana
#   (create the index mapping in Kibana Dev Tools -> elasticsearch/01_mapping.es)
#   docker compose --profile ingest up logstash        # run the CSV -> Elasticsearch pipeline
#
# Linux hosts only: sudo sysctl -w vm.max_map_count=262144   (Docker Desktop on Mac/Windows handles this)
name: ecommerce-elk

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: es01
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kib01
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: ls01
    profiles: ["ingest"]            # only starts when you ask for it
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - XPACK_MONITORING_ENABLED=false
      - ES_HOST=elasticsearch:9200  # used by ${ES_HOST:localhost:9200} in the pipeline
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./data:/usr/share/logstash/data_in:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  esdata:
